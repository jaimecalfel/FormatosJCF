<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oncología HJM · Nuevo sitio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#173B5E 0%,#1F3864 55%,#2c5a8f 100%);color:#16314d}
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#1B2230; --muted:#5A6371; --line:#D3D6DB;
  --accent:#1F3864; --accent-ink:#FFFFFF; --accent-soft:#E4E9F4;
  --fill:#FFF7D1; --fill-line:#E8D98A; --auto:#EDEFF1; --danger:#A33A2B;
  --band:#1F3864; --band-ink:#F4F6FB; --navy:#1F3864;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#15191F; --surface:#1D232B; --ink:#E6EAEE; --muted:#9AA4B0; --line:#2F3742;
  --accent:#8FA9DD; --accent-ink:#0E1628; --accent-soft:#1E2A42;
  --fill:#2A2717; --fill-line:#57502A; --auto:#252C35; --danger:#E0806F;
  --band:#16284A; --band-ink:#EAF0FA; --navy:#9DB4E0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
:root[data-theme="dark"] legend{background:#26416F}
:root[data-theme="dark"] .grp{--t:color-mix(in srgb,var(--c) 22%,#1D232B)}
:root[data-theme="dark"] .fmt{color:#E6EAEE}
@media screen{#dlgResidentGate{width:min(92vw,470px);padding:0;border:0;border-radius:20px;background:#fff;color:#16314d;box-shadow:0 26px 75px rgba(8,35,61,.34);overflow:hidden}
#dlgResidentGate::backdrop{background:rgba(8,28,48,.72);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px)}
.resident-gate-head{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,#0f4268,#176b91);color:#fff}
.resident-gate-logo{display:grid;width:64px;height:64px;place-items:center;border:1px solid rgba(255,255,255,.32);border-radius:16px;background:#fff;box-shadow:0 7px 18px rgba(3,28,49,.2);overflow:hidden}
.resident-gate-logo img{display:block;width:56px;height:56px;object-fit:contain}
.resident-gate-logo.crab img{width:52px;height:52px}
.resident-gate-head h2{margin:0;text-align:center;font-size:22px;line-height:1.12;letter-spacing:.065em}
.resident-gate-body{display:grid;gap:15px;padding:22px 24px 24px}
.resident-gate-field{display:grid;gap:7px}
.resident-gate-field span{font-size:11px;font-weight:900;letter-spacing:.045em;text-transform:uppercase}
.resident-gate-field input{box-sizing:border-box;width:100%;height:48px;padding:0 14px;border:1px solid #b9cada;border-radius:11px;background:#f8fbfd;color:#102b45;font:750 14px/1.2 Arial;outline:0}
.resident-gate-field input:focus{border-color:#1674a0;background:#fff;box-shadow:0 0 0 3px rgba(22,116,160,.13)}
.resident-key-label{display:flex!important;align-items:center;gap:7px}
.resident-drive-logo{display:block;width:21px;height:19px;object-fit:contain}
.resident-gate-msg{min-height:17px;margin:0;color:#b42318;font-size:11px;font-weight:800}
.resident-gate-submit{min-height:46px;border:0;border-radius:11px;background:#0f5f88;color:#fff;font:900 13px/1 Arial;letter-spacing:.02em;box-shadow:0 7px 16px rgba(15,95,136,.2);cursor:pointer}
.resident-gate-submit:hover{background:#0b4f73}
.resident-gate-submit:disabled{opacity:.6;cursor:wait}}
@media screen and (max-width:520px){#dlgResidentGate{border-radius:17px}
.resident-gate-head{grid-template-columns:52px minmax(0,1fr) 52px;gap:9px;padding:16px}
.resident-gate-logo{width:52px;height:52px;border-radius:14px}
.resident-gate-logo img{width:46px;height:46px}
.resident-gate-logo.crab img{width:43px;height:43px}
.resident-gate-body{padding:19px 18px 21px}
.resident-gate-head h2{font-size:18px}}
@media print{#dlgResidentGate{display:none!important}}
@media screen and (max-width:420px){.resident-gate-buttons{flex-direction:column-reverse}}
@media screen{.resident-gate-brand{display:grid;gap:4px;text-align:center;min-width:0}
.resident-gate-brand p{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.88)}}
@media screen and (max-width:520px){.resident-gate-brand p{font-size:11px}}
@media screen{.resident-gate-msg.info{color:#476983}
.resident-gate-msg.ok{color:#0B3775}}
@media screen{.resident-gate-clinic{display:flex;align-items:center;gap:9px;margin:-2px 0 2px;padding:8px 12px;border:1px solid #CFD8E5;border-left:4px solid #0B3775;border-radius:10px;background:#EEF2F7;min-width:0}
.resident-gate-clinic[hidden]{display:none}
.resident-gate-clinic small{flex:0 0 auto;color:#557084;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.resident-gate-clinic b{min-width:0;color:#0B3065;font-size:13.5px;font-weight:800;line-height:1.2}}
#dlgResidentGate .resident-gate-request{display:inline-flex;align-items:center;justify-content:center;gap:6px;justify-self:start;margin:-7px 0 0;padding:7px 13px;border:1px solid #BFD3DF;border-radius:999px;background:#F2F7FA;color:#0B4967;font-weight:800;font-size:12.5px;text-decoration:none;cursor:pointer}
#dlgResidentGate .resident-gate-request:hover{background:#E3EEF6;border-color:#0B4967}
#dlgResidentGate .resident-gate-request .ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
#dlgResidentGate .resident-gate-request[hidden]{display:none!important}
.resident-gate-field:has(#residentGateName){position:relative}
.gate-note{margin:2px 0 6px;text-align:center;font-size:14px;line-height:1.45;color:#41556d}
.resident-gate-buttons.gate-links{display:grid;gap:10px}
.resident-gate-buttons.gate-links a{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.resident-gate-buttons.gate-links a.alt{background:#fff;color:#173B5E;border:1.5px solid #173B5E}
</style>
</head>
